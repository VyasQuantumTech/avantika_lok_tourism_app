name: avantika_lok_tourism_app
description: "Avantika Lok Tourism App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  injectable: ^2.4.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  razorpay_flutter: ^1.4.0

dev_dependencies:
  injectable_generator: ^2.6.0
  build_runner: ^2.2.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/theme/
    - assets/images/common/
    - assets/images/destinations/
    - assets/images/accommodations/
